<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campus Study Buddy</title>
  <meta name="description" content="Ask questions about your course notes and get answers with sources.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232346b0'/%3E%3Crect x='7' y='13' width='18' height='7' rx='2' fill='%23ffe45c'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="masthead">
      <h1>Campus Study Buddy</h1>
      <p class="tagline">Ask anything about your 3rd-semester notes. Every answer shows the file and page it came from.</p>
    </header>

    <!-- The question form. app.js sends this to API Gateway. -->
    <form id="ask-form" class="ask" autocomplete="off">
      <label for="question" class="visually-hidden">Your question</label>
      <textarea id="question" name="question" rows="2" maxlength="500"
        placeholder="e.g. What is the role of MAR and MDR?" required></textarea>
      <button type="submit" id="ask-button">Ask</button>
    </form>

    <!-- Sample questions: shown until the first answer arrives. -->
    <section id="samples" class="samples" aria-label="Sample questions">
      <p>Not sure where to start? Try one:</p>
      <ul>
        <li><button type="button" class="sample">What is a heuristic function?</button></li>
        <li><button type="button" class="sample">Explain the 8-queens problem</button></li>
        <li><button type="button" class="sample">What does a constructor do in Java?</button></li>
        <li><button type="button" class="sample">What topics are in Data Structures Unit 1?</button></li>
      </ul>
    </section>

    <!-- Answer and sources are filled in by app.js. -->
    <section id="result" class="result" aria-live="polite" hidden>
      <h2 id="result-question" class="result-question"></h2>
      <div id="answer" class="answer"></div>
      <h3 id="sources-heading" class="sources-heading">Sources from your notes</h3>
      <ol id="sources" class="sources"></ol>
      <details id="other-sources" class="other-sources" hidden>
        <summary id="other-summary"></summary>
        <ol id="other-list" class="sources"></ol>
      </details>
    </section>

    <p id="status" class="status" role="status"></p>

    <footer class="footer">
      Answers come only from the uploaded notes. Always check the source before you write it in an exam.
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
